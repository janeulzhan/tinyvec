[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyvec"
version = "0.1.0"
description = "An IVF plus product-quantization vector index, written from scratch in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ulzhan Khamidolla", email = "ulzhan@berkeley.edu" }]
keywords = ["vector-search", "product-quantization", "ivf", "nearest-neighbor", "numpy"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tinyvec = "tinyvec.cli:main"

[tool.setuptools.packages.find]
include = ["tinyvec*"]

[tool.setuptools.package-data]
tinyvec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: benchmark-scale tests, excluded from the default CI run",
]
filterwarnings = ["error::RuntimeWarning"]
